[project]
name = "citation-radar"
version = "0.1.0"
description = "Monitor scholarly citations via OpenAlex and notify via Telegram"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
citation-radar = "citation_radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
